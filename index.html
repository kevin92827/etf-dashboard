<title>槓桿ETF監控台・真實資料版</title>
<style>
  :root {
    --bg: #12141a; --surface: #1a1d25; --surface-2: #21252f; --surface-3: #262b36;
    --border: #2c313d; --text: #e9ecf2; --text-dim: #8791a3; --text-faint: #5b6577;
    --accent: #d6a44c; --accent-soft: rgba(214, 164, 76, 0.14); --accent-strong: #f0be6c;
    --pos: #e2555c; --neg: #3fb87f; --pos-soft: rgba(226, 85, 92, 0.13); --neg-soft: rgba(63, 184, 127, 0.13);
    --est: #7aa8d6; --est-soft: rgba(122, 168, 214, 0.14);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    --radius: 10px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f4ee; --surface: #ffffff; --surface-2: #efece1; --surface-3: #e7e2d3;
      --border: #ddd7c6; --text: #20242c; --text-dim: #666f7d; --text-faint: #93a09b;
      --accent: #a8781f; --accent-soft: rgba(168, 120, 31, 0.12); --accent-strong: #8a611a;
      --pos: #c93a41; --neg: #1f8f5f; --pos-soft: rgba(201, 58, 65, 0.10); --neg-soft: rgba(31, 143, 95, 0.10);
      --est: #3568a8; --est-soft: rgba(53, 104, 168, 0.10);
      --shadow: 0 8px 24px rgba(60, 50, 20, 0.10);
      color-scheme: light;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12141a; --surface: #1a1d25; --surface-2: #21252f; --surface-3: #262b36;
    --border: #2c313d; --text: #e9ecf2; --text-dim: #8791a3; --text-faint: #5b6577;
    --accent: #d6a44c; --accent-soft: rgba(214, 164, 76, 0.14); --accent-strong: #f0be6c;
    --pos: #e2555c; --neg: #3fb87f; --pos-soft: rgba(226, 85, 92, 0.13); --neg-soft: rgba(63, 184, 127, 0.13);
    --est: #7aa8d6; --est-soft: rgba(122, 168, 214, 0.14);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f6f4ee; --surface: #ffffff; --surface-2: #efece1; --surface-3: #e7e2d3;
    --border: #ddd7c6; --text: #20242c; --text-dim: #666f7d; --text-faint: #93a09b;
    --accent: #a8781f; --accent-soft: rgba(168, 120, 31, 0.12); --accent-strong: #8a611a;
    --pos: #c93a41; --neg: #1f8f5f; --pos-soft: rgba(201, 58, 65, 0.10); --neg-soft: rgba(31, 143, 95, 0.10);
    --est: #3568a8; --est-soft: rgba(53, 104, 168, 0.10);
    --shadow: 0 8px 24px rgba(60, 50, 20, 0.10);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei UI", "PingFang TC", system-ui, sans-serif;
    line-height: 1.45; -webkit-font-smoothing: antialiased;
  }
  .display { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Noto Serif TC", "Songti TC", serif; }
  .mono, .num { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 64px; }

  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 10px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
  .eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0 0 6px; }
  h1 { font-size: 26px; margin: 0; font-weight: 600; text-wrap: balance; letter-spacing: 0.01em; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-top: 6px; max-width: 60ch; }
  .alert-banner { margin: 0 0 18px; padding: 12px 16px; border-radius: 10px; background: rgba(239,68,68,0.09); border: 1px solid rgba(239,68,68,0.3); }
  .alert-title { font-size: 12.5px; font-weight: 700; color: var(--neg); margin-bottom: 8px; }
  .alert-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .alert-chip { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); }
  .alert-chip b { margin-right: 4px; }
  .alert-chip.pos span.mono { color: var(--pos); font-weight: 700; }
  .alert-chip.neg span.mono { color: var(--neg); font-weight: 700; }
  .snapshot-badge { text-align: right; }
  .snapshot-badge .label { font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-dim); }
  .snapshot-badge .date { font-size: 18px; font-weight: 700; font-family: ui-monospace, Consolas, monospace; }

  .appendix summary {
    cursor: pointer; font-size: 12.5px; color: var(--text-dim); padding: 4px 0; list-style: none;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .appendix summary::-webkit-details-marker { display: none; }
  .appendix summary::before { content: "▸"; color: var(--accent); font-size: 10px; }
  .appendix[open] summary::before { content: "▾"; }
  .appendix summary:hover { color: var(--text); }
  .appendix-body {
    margin-top: 12px; text-align: left; font-size: 12px; color: var(--text-dim);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px 18px; line-height: 1.7;
  }
  .appendix-body h4 { margin: 14px 0 6px; font-size: 12px; color: var(--text); font-weight: 700; }
  .appendix-body h4:first-child { margin-top: 0; }
  .appendix-body ul { margin: 0; padding-left: 18px; }
  .appendix-body b { color: var(--est); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 22px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .stat-label { font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }
  .stat-value { font-size: 21px; font-weight: 600; }
  .stat-sub { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .breadth-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 8px; background: var(--surface-3); }
  .breadth-bar span { height: 100%; }

  .table-shell { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 860px; }
  thead th { position: sticky; top: 0; background: var(--surface-2); border-bottom: 1px solid var(--border); padding: 0; text-align: right; white-space: nowrap; z-index: 1; }
  thead th:first-child { text-align: left; }
  .th-btn { display: flex; align-items: center; justify-content: flex-end; gap: 5px; width: 100%; background: none; border: none; color: var(--text-dim); font: inherit; font-size: 12.5px; letter-spacing: 0.02em; padding: 12px 14px; cursor: pointer; transition: color 0.12s, background 0.12s; }
  thead th:first-child .th-btn { justify-content: flex-start; }
  .th-btn:hover { color: var(--text); background: var(--surface-3); }
  .th-btn .arrow { font-size: 9px; opacity: 0.35; transition: opacity 0.12s; }
  .th-btn.active { color: var(--accent-strong); background: var(--accent-soft); }
  .th-btn.active .arrow { opacity: 1; color: var(--accent-strong); }

  tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.12s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr.selected { background: var(--accent-soft); }
  td { padding: 13px 14px; text-align: right; white-space: nowrap; font-size: 14px; }
  td:first-child { text-align: left; }

  .ticker-cell { display: flex; flex-direction: column; gap: 2px; }
  .ticker-top { display: flex; align-items: baseline; gap: 9px; }
  .ticker-code { font-family: ui-monospace, Consolas, monospace; font-weight: 800; font-size: 19px; letter-spacing: 0.01em; }
  .ticker-price { display: flex; align-items: baseline; gap: 6px; font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .ticker-price .price-val { font-size: 13.5px; color: var(--text-dim); font-weight: 600; }
  .price-chg { font-size: 12px; font-weight: 700; }
  .price-chg.pos { color: var(--pos); } .price-chg.neg { color: var(--neg); } .price-chg.zero { color: var(--text-faint); }
  .ticker-meta { font-size: 11.5px; color: var(--text-dim); display: flex; gap: 7px; align-items: center; margin-top: 3px; flex-wrap: wrap; }
  .lev-tag, .ex-tag, .issuer-tag { font-size: 10.5px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-dim); white-space: nowrap; }
  .lev-tag.long { color: var(--pos); border-color: var(--pos-soft); background: var(--pos-soft); }
  .lev-tag.short { color: var(--neg); border-color: var(--neg-soft); background: var(--neg-soft); }
  .ex-tag, .issuer-tag { background: var(--surface-2); }

  .delta { font-weight: 600; } .delta.pos { color: var(--pos); } .delta.neg { color: var(--neg); } .delta.zero { color: var(--text-dim); }
  .na { color: var(--text-faint); cursor: help; }

  .spark-cell { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 3px; position: relative; }
  td.spark-td { cursor: pointer; }
  .spark-svg { width: 100px; height: 30px; display: block; overflow: visible; }
  .spark-svg:hover { filter: brightness(1.15); }
  .spark-chg-badge { font-size: 10.5px; font-weight: 700; line-height: 1; pointer-events: none; font-variant-numeric: tabular-nums; }
  .spark-chg-badge.pos { color: var(--pos); } .spark-chg-badge.neg { color: var(--neg); } .spark-chg-badge.zero { color: var(--text-faint); } .spark-chg-badge.neutral { color: var(--accent); }

  /* pin the two chart columns to the right edge of the scroll area — at narrower panel widths the table
     needs horizontal scroll, and without this the sparklines (the whole point of those columns) were the
     first thing to scroll out of view / get visually chopped at the container edge */
  .sticky-col-1, .sticky-col-2 { position: sticky; width: 132px; min-width: 132px; z-index: 2; }
  .sticky-col-1 { right: 0; }
  .sticky-col-2 { right: 132px; border-left: 1px solid var(--border); }
  thead th.sticky-col-1, thead th.sticky-col-2 { z-index: 3; background: var(--surface-2); }
  tbody td.sticky-col-1, tbody td.sticky-col-2 { background: var(--surface); }
  tbody tr:hover td.sticky-col-1, tbody tr:hover td.sticky-col-2 { background: var(--surface-2); }
  tbody tr.selected td.sticky-col-1, tbody tr.selected td.sticky-col-2 { background: var(--accent-soft); }

  .hint-row { text-align: center; color: var(--text-faint); font-size: 12px; padding: 8px; margin-top: 8px; }

  /* ---------- 韓股單一個股槓桿ETF (2026-08-31新增，跟上面12檔美股是獨立的一個區塊) ---------- */
  .korea-section { margin-top: 32px; }
  .korea-heading { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .korea-heading h2 { font-size: 16px; margin: 0; font-weight: 700; }
  .korea-heading .sub { font-size: 12px; color: var(--text-dim); }
  .korea-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 14px; }
  @media (max-width: 720px) { .korea-grid { grid-template-columns: 1fr; } }
  .korea-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
  .korea-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .korea-code { font-family: ui-monospace, Consolas, monospace; font-weight: 800; font-size: 16px; }
  .korea-name { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
  .korea-tags { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .korea-tags span { font-size: 10.5px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-dim); background: var(--surface-2); white-space: nowrap; }
  .korea-aum-block { text-align: right; flex-shrink: 0; }
  .korea-aum-val { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .korea-aum-chg { font-size: 12px; font-weight: 600; margin-top: 2px; }
  .korea-aum-date { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }
  .korea-spark { width: 100%; height: 34px; display: block; margin: 6px 0 10px; }
  .korea-holdings-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .korea-holdings-table th { text-align: right; color: var(--text-dim); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; padding: 4px 6px; border-bottom: 1px solid var(--border); }
  .korea-holdings-table th:first-child, .korea-holdings-table td:first-child { text-align: left; }
  .korea-holdings-table td { padding: 5px 6px; text-align: right; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  .korea-holdings-table tr:last-child td { border-bottom: none; }
  .korea-note { font-size: 11px; color: var(--text-faint); margin-top: 8px; }

  /* ---------- Inline expand row ---------- */
  tr.expand-row { cursor: default; } tr.expand-row:hover { background: none; }
  tr.expand-row td { padding: 0; background: var(--surface-2); cursor: default; }
  .detail-inline { padding: 18px 20px 20px; border-top: 1px dashed var(--border); animation: expandIn 0.15s ease-out; }
  @keyframes expandIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }
  .detail-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .detail-title .code { font-family: ui-monospace, Consolas, monospace; font-weight: 700; font-size: 20px; }
  .detail-title .name { color: var(--text-dim); font-size: 14px; }
  .detail-close { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; font-size: 14px; }
  .detail-close:hover { color: var(--text); background: var(--surface-3); }
  .shares-out-line { font-size: 13px; color: var(--text-dim); margin: 0 0 8px; }
  .shares-out-line b { color: var(--text); font-weight: 700; }
  .shares-out-line .text-faint { color: var(--text-faint); font-size: 12px; }
  .detail-subhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .coverage-note { font-size: 12px; color: var(--text-faint); margin: 0; }
  .coverage-note b { color: var(--text-dim); }
  .range-control { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 3px; }
  .range-btn {
    background: none; border: none; color: var(--text-dim); font: inherit; font-size: 12px;
    padding: 4px 11px; border-radius: 5px; cursor: pointer; transition: background 0.12s, color 0.12s;
  }
  .range-btn:hover { color: var(--text); }
  .range-btn.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }

  .chart-rows { display: flex; flex-direction: column; gap: 18px; margin-bottom: 18px; }
  .chart-row { display: grid; grid-template-columns: 1fr 1fr; align-items: start; gap: 18px; }
  .chart-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; min-width: 0; }
  .chart-card h3 { margin: 0 0 2px; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-dim); font-weight: 600; }
  .chart-endval { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .chart-endval .delta60 { font-size: 13px; margin-left: 8px; font-weight: 600; }
  .chart-wrap { position: relative; }
  svg.trend { width: 100%; height: 130px; display: block; overflow: visible; }
  .grid-line { stroke: var(--border); stroke-width: 1; }
  .trend-dot { fill: var(--accent-strong); stroke: var(--surface-2); stroke-width: 2; }
  .hover-line { stroke: var(--text-faint); stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; }
  .hover-dot { fill: var(--accent-strong); stroke: var(--surface); stroke-width: 2; pointer-events: none; }
  .hover-capture { fill: transparent; cursor: crosshair; }
  .chart-tooltip {
    position: absolute; top: 0; left: 0; transform: translate(-50%, 10px);
    background: var(--surface-3); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 12px; white-space: nowrap; pointer-events: none; opacity: 0;
    box-shadow: var(--shadow); z-index: 5;
  }
  /* sparkline tooltips (dense table rows, no room below): flip to sit above the chart instead,
     otherwise the box bleeds into the next row down — see .tooltip-below default above */
  .chart-tooltip.tooltip-above { transform: translate(-50%, calc(-100% - 10px)); }
  .chart-tooltip .tt-date { color: var(--text-dim); font-family: ui-monospace, Consolas, monospace; font-size: 11px; margin-bottom: 2px; }
  .chart-tooltip .tt-val { font-weight: 700; font-variant-numeric: tabular-nums; }
  .no-data-card { display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 13px; text-align: center; padding: 20px; min-height: 130px; }

  /* ---------- Explorable tables: look-through / raw holdings ---------- */
  .explore-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
  .explore-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .explore-head h3 { margin: 0; font-size: 13px; color: var(--text); font-weight: 700; }
  .explore-sub { display: block; font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }
  .explore-mode {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font: inherit; font-size: 12.5px; padding: 5px 8px; cursor: pointer;
  }
  .explore-mode:focus { outline: none; border-color: var(--accent); }
  .explore-search {
    width: 100%; margin: 10px 0 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font: inherit; font-size: 13px; padding: 7px 10px;
  }
  .explore-search:focus { outline: none; border-color: var(--accent); }
  .explore-scroll { max-height: 380px; overflow-y: auto; overflow-x: auto; border-top: 1px solid var(--border); }
  table.explore-table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 0; }
  table.explore-table col.c-name { width: 46%; }
  table.explore-table col.c-num { width: 18%; }
  table.explore-table th { position: sticky; top: 0; background: var(--surface-2); text-align: right; font-size: 11.5px; color: var(--text-dim); font-weight: 600; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  table.explore-table th:first-child { text-align: left; }
  table.explore-table td { text-align: right; padding: 7px 8px; font-size: 13px; border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  table.explore-table td:first-child { text-align: left; white-space: normal; }
  table.explore-table tbody tr:nth-child(even) td { background: var(--surface-3); }
  .explore-count { font-size: 11.5px; color: var(--text-faint); margin-top: 8px; }
  details.raw-toggle summary { cursor: pointer; font-size: 12.5px; color: var(--text-dim); padding: 4px 0; list-style: none; }
  details.raw-toggle summary::-webkit-details-marker { display: none; }
  details.raw-toggle summary::before { content: "▸ "; color: var(--accent); }
  details.raw-toggle[open] summary::before { content: "▾ "; }
  .method-tag { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; background: var(--surface-3); color: var(--text-dim); white-space: nowrap; }
  .ticker-badge { font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; white-space: nowrap; }

  @media (max-width: 760px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .chart-row { grid-template-columns: 1fr; }
    header { align-items: stretch; }
  }
  footer { margin-top: 28px; color: var(--text-faint); font-size: 11.5px; text-align: center; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Real Scraped Data · 12 Leveraged ETFs</p>
      <h1 class="display">槓桿ETF監控台・真實資料版</h1>
      <p class="subtitle">AUM／淨值／市價／個股曝險拆解 — 真實爬蟲資料</p>
    </div>
    <div class="snapshot-badge">
      <div class="label">最後更新時間</div>
      <div class="date mono" id="buildTime">2026-09-02 16:31</div>
    </div>
  </header>

  <section class="alert-banner" id="alertBanner" style="display:none"></section>

  <section class="stats" id="statStrip"></section>

  <div class="table-shell">
    <div class="table-scroll">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>

// ---- formatting ----
function fmtUSDCompact(v) {
  if (v === null || v === undefined) return "—";
  const abs = Math.abs(v);
  if (abs >= 1e9) return "$" + (v / 1e9).toFixed(2) + "B";
  if (abs >= 1e6) return "$" + (v / 1e6).toFixed(1) + "M";
  if (abs >= 1e3) return "$" + (v / 1e3).toFixed(0) + "K";
  return "$" + v.toFixed(0);
}
function fmtUSD2(v) { return (v === null || v === undefined) ? "—" : "$" + v.toFixed(2); }
// 這三個fmt*Signed/fmtPct都先把數字格式化成字串、再從字串判斷「四捨五入後是不是真的變成0」才決定
// 要不要加正負號——不能直接看原始值v的正負號，不然像-0.4這種小負數，四捨五入顯示出來是"0"，
// 但正負號還是照v<0印出"−0"，會出現這種看起來像bug的假負號。
function fmtUSDCompactSigned(v) {
  if (v === null || v === undefined) return "—";
  const mag = fmtUSDCompact(Math.abs(v));
  const isZero = parseFloat(mag.replace(/[^0-9.]/g, "")) === 0;
  return (isZero ? "" : (v >= 0 ? "+" : "−")) + mag;
}
function fmtInt(v) { return (v === null || v === undefined) ? "—" : Math.round(v).toLocaleString("en-US"); }
function fmtIntSigned(v) {
  if (v === null || v === undefined) return "—";
  const mag = fmtInt(Math.abs(v));
  const isZero = parseFloat(mag.replace(/,/g, "")) === 0;
  return (isZero ? "" : (v >= 0 ? "+" : "−")) + mag;
}
function fmtPct(v, d) {
  if (v === null || v === undefined) return "—";
  const digits = d === undefined ? 2 : d;
  const mag = Math.abs(v).toFixed(digits);
  const isZero = parseFloat(mag) === 0;
  return (isZero ? "" : (v > 0 ? "+" : "-")) + mag + "%";
}
function deltaClass(v) { if (v === null || v === undefined) return "zero"; if (v > 0) return "pos"; if (v < 0) return "neg"; return "zero"; }
// deltaClass只看原始值的正負號，數字很小捨入後顯示是"0"時，顏色卻還是紅/綠，文字跟顏色會對不起來。
// 這三個版本改成跟旁邊fmt*函式用同一套「捨入後是否真的變成0」邏輯再決定顏色，維持顯示與顏色一致。
function deltaClassPct(v, d) {
  if (v === null || v === undefined) return "zero";
  if (parseFloat(Math.abs(v).toFixed(d === undefined ? 2 : d)) === 0) return "zero";
  return v > 0 ? "pos" : "neg";
}
function deltaClassInt(v) {
  if (v === null || v === undefined) return "zero";
  if (Math.round(Math.abs(v)) === 0) return "zero";
  return v > 0 ? "pos" : "neg";
}
function deltaClassUSDCompact(v) {
  if (v === null || v === undefined) return "zero";
  if (parseFloat(fmtUSDCompact(Math.abs(v)).replace(/[^0-9.]/g, "")) === 0) return "zero";
  return v > 0 ? "pos" : "neg";
}

    <h4>「發行單位數變化」「發行股數近20日走勢」欄位是怎麼來的</h4>
    <p>發行股數沒有逐日官方序列可查，用AUM／淨值(NAV)當天的比值(AUM＝淨值×發行股數，兩者皆知就能反推)當估算值——因為AUM上漲有兩種可能：淨值(標的股價)自己漲、或是真的有新資金流入(發行股數增加)，這個比值等於把「價格效果」濾掉，只留下比較接近「資金流」的部分。沒有逐日NAV的標的改用市價當分母(兩者通常很接近)。「發行單位數變化」欄放的是這條估算序列較前一交易日的變化量，後面括號是同一筆變化量換算成的百分比；20日的增幅版本改放在「發行股數近20日走勢」縮圖左上角的badge，避免跟這欄重複。展開列的「發行股數」大圖用的也是同一份估算序列，數字前面都標了≈。AUM近20日走勢縮圖左上角的增幅標註則直接對應主表格排序用的「AUM」欄近20日變化，統計列「發行股數(估算) 近20日增幅家數」用的也是「發行股數近20日走勢」縮圖同一套20日數字。</p>

    <p>這兩欄是原本合稱「衝擊金額」的估算值拆開來的兩塊：<b>再平衡金額</b> — 追蹤指數(或標的)漲跌時，基金為維持固定槓桿倍數必須交易的金額，公式是 <code>AUM×(槓桿-1)×淨值當日報酬率</code>（用淨值當日報酬率反推指數報酬率，槓桿倍數在化簡過程中會自己消掉，不用另外抓指數逐日資料）；<b>申贖影響金額</b> — 當天發行股數的估算變化量(見「發行單位數變化」欄)乘上淨值，代表有人申購/贖回實際造成的買賣壓力。兩者是ETF發行商當天要在市場上交易的兩個獨立來源，分開列出方便判斷這天的交易壓力主要是「指數自己漲跌造成的再平衡」還是「真的有資金申購/贖回」。兩欄都是估算值：不只槓桿倍數關係是理論上的近似，發行股數本身也是估算值。</p>

// 2026-08-10修正：這三個trailingXSpark原本各自獨立取「最後n筆」，跟展開列大圖踩過的是
// 同一種bug——SKUU/SKHU/SKDD這種序列中間有小缺口的標的，AUM近20筆起點跟發行股數/衝擊金額
// 近20筆起點會差1~2天，同一列三個縮圖看起來像同一段「近20日」，實際日期卻對不齊。改用
// rangeCutoffDate(以AUM序列為準決定日期下限)+sliceTrailing(依日期篩選)，跟展開列大圖共用
// 同一套對齊邏輯，不再各自各算各的天數。
function trailingAumSpark(code, n) {
  const series = sliceTrailing(AUM_SERIES[code] || [], rangeCutoffDate(code, n));
  return { values: series.map(p => p.aum), dates: series.map(p => p.date) };
}
// AUM/淨值比值＝近似「流通單位數」走勢——把AUM的變化拆開來看，剔除掉「淨值(標的價格)本身漲跌」的效果，
// 只留下比較接近「真的有沒有資金流入流出」的部分
function trailingFlowSpark(code, n) {
  const series = sliceTrailing(FLOW_SERIES[code] || [], rangeCutoffDate(code, n));
  return { values: series.map(p => p.ratio), dates: series.map(p => p.date) };
}
// 發行單位數(估算)近20日變化率——給「發行股數近20日走勢」縮圖上的badge，以及下面統計列「發行股數版」
// 增幅家數共用同一個算法/同一個數字，不要各算各的。
function flowChg20ForCode(code) {
  const fs = trailingFlowSpark(code, 20).values;
  return fs.length >= 2 ? (fs[fs.length - 1] / fs[0] - 1) * 100 : null;
}
// 發行單位數(估算)較前一交易日變化——主表格「發行單位數變化」欄用(絕對數字+括號內百分比)，
// 20日的增幅版本已經在「發行股數近20日走勢」縮圖的badge上看得到了，這欄只放1日版本，不重複。
function flowChg1dForCode(code) {
  const series = FLOW_SERIES[code] || [];
  if (series.length < 2) return { delta: null, pct: null };
  const prev = series[series.length - 2].ratio;
  const cur = series[series.length - 1].ratio;
  return { delta: cur - prev, pct: prev ? (cur / prev - 1) * 100 : null };
}
// 發行單位數(估算)近5個交易日變化率——資金流入警示用。用交易日數(不是日曆天數)往回數，
// 跟aumChg20那套「近N筆」邏輯一致，避開週末/假日算法的坑。史料不足5個交易日就回傳null，不硬湊。
const ALERT_THRESHOLD_PCT = 10;
function flowChg5dForCode(code) {
  const series = FLOW_SERIES[code] || [];
  if (series.length < 6) return null;
  const prev = series[series.length - 6].ratio;
  const cur = series[series.length - 1].ratio;
  return prev ? (cur / prev - 1) * 100 : null;
}
function sparkSVG(values, trendClass, svgId) {
  if (values.length < 2) {
    return `<span class="na" title="史料不足，無法繪製走勢">資料不足</span>`;
  }
  const w = 100, h = 30, pad = 2;
  const min = Math.min(...values), max = Math.max(...values);
  const span = (max - min) || 1;
  const innerW = w - pad * 2, innerH = h - pad * 2;
  const pts = values.map((v, i) => [pad + (i / (values.length - 1)) * innerW, pad + innerH - ((v - min) / span) * innerH]);
  const line = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L${pts[pts.length - 1][0].toFixed(1)} ${h - pad} L${pts[0][0].toFixed(1)} ${h - pad} Z`;
  const color = trendClass === "neg" ? "var(--neg)" : trendClass === "pos" ? "var(--pos)" : "var(--accent)";
  return `<svg class="spark-svg" id="${svgId}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${area}" fill="${color}" fill-opacity="0.16" stroke="none" />
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="${pts[pts.length - 1][0]}" cy="${pts[pts.length - 1][1]}" r="1.8" fill="${color}" />
    <line class="hover-line" x1="0" y1="${pad}" x2="0" y2="${h - pad}" opacity="0" />
    <circle class="hover-dot" cx="0" cy="0" r="2.4" style="fill:${color}" opacity="0" />
    <rect class="hover-capture" x="0" y="0" width="${w}" height="${h}" />
  </svg>`;
}

// ---- charts ----
function buildLinePath(values, w, h, pad) {
  const min = Math.min(...values), max = Math.max(...values);
  const span = (max - min) || 1;
  const innerW = w - pad * 2, innerH = h - pad * 2;
  const pts = values.map((v, i) => [pad + (i / (values.length - 1)) * innerW, pad + innerH - ((v - min) / span) * innerH]);
  const line = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L${pts[pts.length - 1][0].toFixed(1)} ${h - pad} L${pts[0][0].toFixed(1)} ${h - pad} Z`;
  return { line, area, pts };
}
function chartSVGString(values, gradId, svgId) {
  const w = 560, h = 130, pad = 8;
  const { line, area, pts } = buildLinePath(values, w, h, pad);
  const gridY = [pad, h / 2, h - pad];
  return `<svg class="trend" id="${svgId}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.28" /><stop offset="100%" stop-color="var(--accent)" stop-opacity="0" />
    </linearGradient></defs>
    ${gridY.map(y => `<line class="grid-line" x1="${pad}" y1="${y}" x2="${w - pad}" y2="${y}" />`).join("")}
    <path d="${area}" fill="url(#${gradId})" stroke="none" />
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <circle class="trend-dot" cx="${pts[pts.length - 1][0]}" cy="${pts[pts.length - 1][1]}" r="4" />
    <line class="hover-line" x1="0" y1="${pad}" x2="0" y2="${h - pad}" opacity="0" />
    <circle class="hover-dot" cx="0" cy="0" r="4.5" opacity="0" />
    <rect class="hover-capture" x="0" y="0" width="${w}" height="${h}" />
  </svg>`;
}
function attachChartHover(svgId, tooltipId, values, dates, formatValue, dims) {
  const svg = document.getElementById(svgId);
  const tooltip = document.getElementById(tooltipId);
  if (!svg || !tooltip) return;
  const { w, h, pad, above } = dims || { w: 560, h: 130, pad: 8 };
  // big detail charts have generous padding below them, so the tooltip sits below the line — but the
  // table's sparklines are packed into dense rows with no room below, and "below" there bleeds into the
  // NEXT row down. dims.above flips it to sit above the sparkline instead for those callers.
  tooltip.classList.toggle("tooltip-above", !!above);
  const { pts } = buildLinePath(values, w, h, pad);
  const capture = svg.querySelector(".hover-capture");
  const hoverLine = svg.querySelector(".hover-line");
  const hoverDot = svg.querySelector(".hover-dot");
  const innerW = w - pad * 2;
  function move(e) {
    const rect = svg.getBoundingClientRect();
    if (rect.width === 0) return;
    const relX = ((e.clientX - rect.left) / rect.width) * w;
    let idx = Math.round(((relX - pad) / innerW) * (values.length - 1));
    idx = Math.max(0, Math.min(values.length - 1, idx));
    const [px, py] = pts[idx];
    hoverLine.setAttribute("x1", px); hoverLine.setAttribute("x2", px); hoverLine.setAttribute("opacity", "1");
    hoverDot.setAttribute("cx", px); hoverDot.setAttribute("cy", py); hoverDot.setAttribute("opacity", "1");
    tooltip.style.left = (px / w * 100) + "%";
    tooltip.style.top = (above ? 0 : h) + "px";
    tooltip.style.opacity = "1";
    tooltip.innerHTML = `<div class="tt-date">${dates[idx]}</div><div class="tt-val">${formatValue(values[idx])}</div>`;
  }
  function leave() { hoverLine.setAttribute("opacity", "0"); hoverDot.setAttribute("opacity", "0"); tooltip.style.opacity = "0"; }
  capture.addEventListener("mousemove", move);
  capture.addEventListener("mouseleave", leave);
}
function noDataCard(msg) { return `<div class="no-data-card">${msg}</div>`; }

// ---- explorable holdings / look-through tables ----
function escapeHtml(s) { return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
// ticker是best-effort反查來的（不是原始資料本身就有），查不到就不顯示，不強求100%覆蓋
function nameWithTicker(h) { return `${escapeHtml(h.name)}${h.ticker ? ` <span class="ticker-badge">${escapeHtml(h.ticker)}</span>` : ""}`; }

function lookthroughRowsHTML(items) {
  if (!items.length) return `<tr><td colspan="3" style="text-align:center; color:var(--text-faint);">無符合項目</td></tr>`;
  return items.map(h => `
    <tr>
      <td>${nameWithTicker(h)}</td>
      <td class="mono ${deltaClass(h.weight)}" style="color:${h.weight >= 0 ? "inherit" : "var(--text-dim)"}">${h.weight.toFixed(2)}%</td>
      <td><span class="method-tag">${escapeHtml(h.method)}</span></td>
    </tr>`).join("");
}
function holdingsRowsHTML(items) {
  if (!items.length) return `<tr><td colspan="4" style="text-align:center; color:var(--text-faint);">無符合項目</td></tr>`;
  return items.map(h => `
    <tr>
      <td>${nameWithTicker(h)}</td>
      <td class="mono">${h.weight.toFixed(3)}%</td>
      <td class="mono">${fmtInt(h.units)}</td>
      <td style="font-size:11.5px; color:var(--text-faint);">${escapeHtml(h.source)}</td>
    </tr>`).join("");
}

// 持股明細：預設顯示「拆解前」的原始持股（swap/現股逐筆），下拉選單可切成「拆解後」的個股曝險look-through。
// 兩種模式共用同一個表格殼，欄位定義不同，切換時只重繪 thead/colgroup/tbody，不用重建整張卡片。
function exploreTableContent(code, mode, query) {
  if (mode === "lookthrough") {
    const all = LOOKTHROUGH[code] || [];
    const items = query ? all.filter(x => x.name.toLowerCase().includes(query)) : all;
    return {
      colgroup: `<col class="c-name"><col class="c-num"><col>`,
      thead: `<tr><th>個股／分類</th><th>有效曝險權重</th><th>組成方式</th></tr>`,
      body: lookthroughRowsHTML(items),
      total: all.length, shown: items.length,
    };
  }
  const h = HOLDINGS[code];
  const all = (h && h.items) || [];
  const items = query ? all.filter(x => x.name.toLowerCase().includes(query)) : all;
  return {
    colgroup: `<col class="c-name"><col class="c-num"><col class="c-num"><col>`,
    thead: `<tr><th>個股名稱</th><th>投資比例</th><th>持有單位</th><th>資料來源</th></tr>`,
    body: holdingsRowsHTML(items),
    total: all.length, shown: items.length,
    date: h ? h.date : null,
  };
}

function buildHoldingsExploreCard(code) {
  const hasHoldings = HOLDINGS[code] && HOLDINGS[code].items.length;
  const hasLookthrough = LOOKTHROUGH[code] && LOOKTHROUGH[code].length;
  if (!hasHoldings && !hasLookthrough) {
    return `<div class="explore-card">
      <div class="explore-head"><h3>持股明細</h3></div>
      ${noDataCard("此標的目前沒有持股／曝險拆解資料（發行商未提供每日持股feed）")}
    </div>`;
  }
  const initial = exploreTableContent(code, "raw", "");
  return `
    <div class="explore-card">
      <div class="explore-head">
        <h3>持股明細</h3>
        <select class="explore-mode" id="mode-${code}">
          <option value="raw"${hasHoldings ? "" : " disabled"}>原始持股（拆解前）</option>
          <option value="lookthrough"${hasLookthrough ? "" : " disabled"}>個股曝險拆解（拆解後）</option>
        </select>
      </div>
      <span class="explore-sub" id="modeSub-${code}">${initial.date ? "資料日期 " + initial.date : ""}</span>
      <input class="explore-search" id="expSearch-${code}" placeholder="搜尋個股名稱／分類…" />
      <div class="explore-scroll">
        <table class="explore-table">
          <colgroup id="colgroup-${code}">${initial.colgroup}</colgroup>
          <thead id="thead-${code}">${initial.thead}</thead>
          <tbody id="tbody-${code}">${initial.body}</tbody>
        </table>
      </div>
      <div class="explore-count" id="count-${code}">共 ${initial.shown} 筆</div>
    </div>`;
}

// range: null(全部) | 20 | 60 — 只影響「展開列裡的AUM/淨值大圖」，跟表格裡固定近20日的縮圖是兩回事
// 2026-08-10修正：原本AUM/發行股數/衝擊金額三條序列各自獨立取「最後N筆」，但發行股數
// (=AUM∩淨值的交集)常常比AUM本身涵蓋的交易日少（例如SOXL的AUM有401天、發行股數只有
// 31天），選同樣的「60日」，AUM圖畫出的日期範圍(5/18~8/7)跟發行股數圖(只有31天可用，
// 6/25~8/7)左端點對不齊，看起來像同一個「60日」卻不是同一段時間。改成：先用AUM序列
// (目前資料最完整)決定這個range對應到哪一天當下限，其他序列都篩選「這個日期以後」，
// 不再各自各算各的天數——史料不足的序列會自然畫出比較短的線，但左端點不會跟AUM對不上。
function rangeCutoffDate(code, range) {
  if (!range) return null;
  const aseries = AUM_SERIES[code] || [];
  if (!aseries.length) return null;
  return aseries[Math.max(0, aseries.length - range)].date;
}
function sliceTrailing(series, cutoffDate) {
  return cutoffDate ? series.filter(p => p.date >= cutoffDate) : series;
}

function attachDetailChartHovers(code, range) {
  const s = SNAPSHOT[code];
  const cutoffDate = rangeCutoffDate(code, range);
  const aseries = sliceTrailing(AUM_SERIES[code] || [], cutoffDate);
  if (aseries.length >= 2) {
    attachChartHover("aumSvg-" + code, "aumTip-" + code, aseries.map(p => p.aum), aseries.map(p => p.date), fmtUSDCompact);
  }
  const fseries = sliceTrailing(FLOW_SERIES[code] || [], cutoffDate);
  if (fseries.length >= 2) {
    attachChartHover("sharesSvg-" + code, "sharesTip-" + code, fseries.map(p => p.ratio), fseries.map(p => p.date), v => "≈" + fmtInt(v) + " 單位");
  }
}

function wireDetailInteractivity(code) {
  attachDetailChartHovers(code, null);

  document.querySelectorAll(`.range-btn[data-code="${code}"]`).forEach(btn => {
    btn.addEventListener("click", () => {
      const range = btn.dataset.range === "all" ? null : +btn.dataset.range;
      document.querySelectorAll(`.range-btn[data-code="${code}"]`).forEach(b => b.classList.toggle("active", b === btn));
      document.getElementById("chartsWrap-" + code).innerHTML = renderChartsSection(code, range);
      attachDetailChartHovers(code, range);
    });
  });

  const modeSelect = document.getElementById("mode-" + code);
  const searchInput = document.getElementById("expSearch-" + code);
  if (modeSelect && searchInput) {
    const refresh = () => {
      const mode = modeSelect.value;
      const q = searchInput.value.trim().toLowerCase();
      const r = exploreTableContent(code, mode, q);
      document.getElementById("colgroup-" + code).innerHTML = r.colgroup;
      document.getElementById("thead-" + code).innerHTML = r.thead;
      document.getElementById("tbody-" + code).innerHTML = r.body;
      document.getElementById("count-" + code).textContent = `共 ${r.shown} 筆` + (q ? `（篩選自 ${r.total} 筆）` : "");
      document.getElementById("modeSub-" + code).textContent =
        mode === "lookthrough" ? "最近一次拆解結果・非時間序列・權重已反映槓桿倍數" : (r.date ? "資料日期 " + r.date : "");
    };
    modeSelect.addEventListener("change", refresh);
    searchInput.addEventListener("input", refresh);
  }
}

// range: null(全部) | 20 | 60。回傳「淨值/市價卡 + AUM卡」那一整排的HTML。
function renderChartsSection(code, range) {
  const s = SNAPSHOT[code];
  const cutoffDate = rangeCutoffDate(code, range);
  const aseries = sliceTrailing(AUM_SERIES[code] || [], cutoffDate);
  const fseries = sliceTrailing(FLOW_SERIES[code] || [], cutoffDate);
  const rangeLabel = range ? `${range}日` : "全部可用歷史";

  let navChartHtml, navTitle, navSubtitle;
  if (fseries.length >= 2) {
    const chg = ((fseries[fseries.length - 1].ratio / fseries[0].ratio) - 1) * 100;
    navTitle = `發行股數（估算＝AUM/淨值）・${rangeLabel}`;
    navSubtitle = `≈${fmtInt(fseries[fseries.length - 1].ratio)} 單位 <span class="delta60 ${deltaClassPct(chg)}">${fmtPct(chg)} / ${fseries.length}日</span>`;
    navChartHtml = `<div class="chart-wrap">${chartSVGString(fseries.map(p => p.ratio), "navGrad-" + code, "sharesSvg-" + code)}<div class="chart-tooltip" id="sharesTip-${code}"></div></div>`;
  } else {
    navTitle = `發行股數（估算）・${rangeLabel}`; navSubtitle = "";
    navChartHtml = noDataCard("暫無歷史走勢資料");
  }

  // 「全部」模式改成算真正的「累積歷史序列起點以來」漲跌幅(不再借用近20日增幅頂替)——年輕基金
  // (如SNXX，種子資金僅25萬美元)算出來可能是+79萬%這種誇張數字，但那是真實情況不是bug，用「自
  // YYYY-MM-DD」的標籤明確標出時間跨度，讓使用者自己判斷這是長期數字、不是短期漲跌，不用刻意藏起來。
  // ⚠️ 2026-09-01使用者要求拿掉「成立以來」的措辭：這個日期是「我們累積的歷史序列從哪天開始」
  // (aumHistoryStart)，不是驗證過的基金真正成立/上市日，不要暗示兩者是同一件事。
  let aumSubtitle;
  if (aseries.length >= 2) {
    const chg = ((aseries[aseries.length - 1].aum / aseries[0].aum) - 1) * 100;
    const label = range ? `${aseries.length}日` : `自${aseries[0].date}`;
    aumSubtitle = `${fmtUSDCompact(s.aum)} <span class="delta60 ${deltaClassPct(chg)}">${fmtPct(chg)} / ${label}</span>`;
  } else {
    aumSubtitle = `${fmtUSDCompact(s.aum)} <span class="na" title="史料不足，無法計算漲跌幅">—</span>`;
  }
  const aumChartHtml = aseries.length >= 2
    ? `<div class="chart-wrap">${chartSVGString(aseries.map(p => p.aum), "aumGrad-" + code, "aumSvg-" + code)}<div class="chart-tooltip" id="aumTip-${code}"></div></div>`
    : noDataCard("暫無歷史走勢資料");

  return `
    <div class="chart-row">
      <div class="chart-card">
        <h3>${navTitle}（滑鼠移到圖上可看當天數值）</h3>
        <div class="chart-endval">${navSubtitle}</div>
        ${navChartHtml}
      </div>
      <div class="chart-card">
        <h3>AUM・${rangeLabel}（滑鼠移到圖上可看當天數值）</h3>
        <div class="chart-endval">${aumSubtitle}</div>
        ${aumChartHtml}
      </div>
    </div>
  `;
}

function buildDetailRowHTML(code) {
  const meta = META[code] || {};
  const s = SNAPSHOT[code];

  const coverageBits = [];
  if (s.aumHistoryDays) coverageBits.push(`AUM ${s.aumHistoryDays}日`);
  const sharesHistoryDays = (FLOW_SERIES[code] || []).length;
  if (sharesHistoryDays) coverageBits.push(`發行股數(估算) ${sharesHistoryDays}日`);
  if (s.priceHistoryDays) coverageBits.push(`市價 ${s.priceHistoryDays}日`);
  if (s.navHistoryDays) coverageBits.push(`NAV ${s.navHistoryDays}日${s.navIsDerived ? "（回推估算）" : ""}`);
  else if (s.navIsEstimate) coverageBits.push(`NAV僅單點估算`);

  return `
    <tr class="expand-row" data-expand-for="${code}">
      <td colspan="${COLUMNS.length}">
        <div class="detail-inline">
          <div class="detail-head">
            <div class="detail-title">
              <span class="code mono">${code}</span>
              <span class="name">${meta.cat || ""} · ${meta.name || ""} · ${meta.lev || ""} · ${meta.issuer || ""} · ${meta.ex || ""}</span>
            </div>
            <button class="detail-close" data-close="${code}" title="收合">✕</button>
          </div>
          <p class="shares-out-line">流通在外股數 <b class="mono">${fmtInt(s.sharesOut)}</b>${s.sharesOutDate ? ` <span class="text-faint">（資料日期 ${s.sharesOutDate}）</span>` : ""}</p>
          <div class="detail-subhead">
            <!-- 2026-09-01：使用者要求先不要顯示這行(AUM/發行股數/市價/NAV各自涵蓋天數)，
                 起因是Direxion系5檔目前NAV天數卡在1天(官方30日API金鑰過期的假象，見
                 scrape_price_nav_history.py)，容易誤導。coverageBits邏輯保留，只是不渲染，
                 之後金鑰修好、數字正常了可以把這行p標籤加回來。 -->
            <div class="range-control">
              <button class="range-btn" data-code="${code}" data-range="20">20日</button>
              <button class="range-btn" data-code="${code}" data-range="60">60日</button>
              <button class="range-btn active" data-code="${code}" data-range="all">全部</button>
            </div>
          </div>
          <div class="chart-rows" id="chartsWrap-${code}">${renderChartsSection(code, null)}</div>
          ${buildHoldingsExploreCard(code)}
        </div>
      </td>
    </tr>
  `;
}

// ---- 韓股單一個股槓桿ETF (2026-08-31新增) ----
// 跟上面12檔美股是完全獨立的資料/渲染路徑，只共用sparkSVG()這個純函式(接受一組
// 數字陣列畫縮圖，跟12檔的資料結構無關，可以直接借來用)跟既有的.stat-card/.chart-card
// 視覺語彙(CSS)，不碰SNAPSHOT/AUM_SERIES這些12檔專用的全域變數。
function fmtEok(v) {  // 億원(1億韓元)
  if (v === null || v === undefined) return "—";
  return v.toLocaleString("en-US", { maximumFractionDigits: 0 }) + "億원";
}
function fmtWon(v) {
  if (v === null || v === undefined) return "—";
  return "₩" + Math.round(v).toLocaleString("en-US");
}
function renderKoreaSection() {
  const el = document.getElementById("koreaSection");
  const list = DATA.koreaEtfs || [];
  if (!list.length) { el.innerHTML = ""; return; }

  const cards = list.map(e => {
    const vals = (e.aumSeries || []).map(p => p.aum);
    const spark = vals.length >= 2
      ? sparkSVG(vals, deltaClass(e.aumChgPct), "korea-spark-" + e.code).replace('class="spark-svg"', 'class="korea-spark"')
      : `<div class="korea-spark" style="display:flex;align-items:center;color:var(--text-faint);font-size:11px;">史料不足</div>`;
    const chgCls = deltaClass(e.aumChgPct);
    const holdingsRows = (e.holdings || []).map(h => `
      <tr>
        <td>${h.name}${h.code ? ` <span style="color:var(--text-faint);">(${h.code})</span>` : ""}</td>
        <td>${fmtPct(h.weightPct, 1)}</td>
        <td>${fmtInt(h.qty)}</td>
        <td>${fmtWon(h.valueKRW)}</td>
      </tr>`).join("");
    return `
    <div class="korea-card">
      <div class="korea-card-head">
        <div>
          <div class="korea-code">${e.code}</div>
          <div class="korea-name">${e.name}</div>
          <div class="korea-tags"><span>${e.issuer}</span><span>${e.underlying}</span><span>${e.leverage}x槓桿</span></div>
        </div>
        <div class="korea-aum-block">
          <div class="korea-aum-val mono">${fmtEok(e.aum)}</div>
          <div class="korea-aum-chg delta ${chgCls} mono">${fmtPct(e.aumChgPct, 1)}</div>
          <div class="korea-aum-date mono">${e.aumDate || "—"}</div>
        </div>
      </div>
      ${spark}
      <table class="korea-holdings-table">
        <thead><tr><th>成分</th><th>比重</th><th>數量</th><th>評價金額</th></tr></thead>
        <tbody>${holdingsRows || `<tr><td colspan="4" style="text-align:center;color:var(--text-faint);">尚無持股資料</td></tr>`}</tbody>
      </table>
      <div class="korea-note">持股PDF日期：${e.holdingsDate || "—"}・比重加總會遠超過100%是正常現象(期貨+現金組合放大曝險的必然結果，不是資料錯誤)</div>
    </div>`;
  }).join("");

  el.innerHTML = `
    <div class="korea-heading">
      <h2 class="display">韓股單一個股槓桿ETF</h2>
      <span class="sub">KODEX／TIGER・SK Hynix・Samsung Electronics・2倍槓桿</span>
    </div>
    <div class="korea-grid">${cards}</div>
  `;
}

renderAlertBanner();
renderStats();
renderHead();
renderBody();
